[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chest-evidence-agent"
version = "0.1.0"
description = "Local multimodal chest-case reasoning with traceable evidence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1",
  "langgraph>=1,<2", "pydantic>=2.9,<3", "openai>=2,<3",
  "torch>=2.8", "torchvision>=0.23", "transformers>=4.57,<5",
  "accelerate>=1", "torchxrayvision>=1.4,<2", "Pillow>=10",
  "numpy>=1.26", "requests>=2", "beautifulsoup4>=4", "scikit-learn>=1.5",
  "huggingface-hub>=0.36,<1",
  "json-repair>=0.63,<1",
  "lm-format-enforcer>=0.11,<0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]
quantized = ["bitsandbytes>=0.50,<1"]
ui-test = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["chest_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
